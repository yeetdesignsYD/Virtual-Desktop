
<svg xmlns="http://www.w3.org/2000/svg"
     width="100%"
     height="50"
     viewBox="0 0 400 50">

  <defs>
    <linearGradient id="rainbow"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">

      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="16.6%" stop-color="#ff8800"/>
      <stop offset="33.3%" stop-color="#ffff00"/>
      <stop offset="50%" stop-color="#00ff00"/>
      <stop offset="66.6%" stop-color="#00ccff"/>
      <stop offset="83.3%" stop-color="#7700ff"/>
      <stop offset="100%" stop-color="#ff0000"/>

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="-1 0"
        to="1 0"
        dur="4s"
        repeatCount="indefinite"
        additive="sum"/>

    </linearGradient>
  </defs>

  <text x="200"
        y="38"
        text-anchor="middle"
        fill="url(#rainbow)"
        font-size="32"
        font-weight="bold"
        font-family="Arial, sans-serif">
    Virtual-Desktop
  </text>

</svg>
