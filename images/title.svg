
<svg xmlns="http://www.w3.org/2000/svg"
     width="100%"
     viewBox="0 0 800 100">

  <defs>
    <linearGradient id="rainbow"
                    x1="-400" y1="0"
                    x2="0" y2="0"
                    gradientUnits="userSpaceOnUse"
                    spreadMethod="repeat">

      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="16.6%" stop-color="#ff8800"/>
      <stop offset="33.3%" stop-color="#ffff00"/>
      <stop offset="50%" stop-color="#00ff00"/>
      <stop offset="66.6%" stop-color="#00ccff"/>
      <stop offset="83.3%" stop-color="#7700ff"/>
      <stop offset="100%" stop-color="#ff0000"/>

      <animate attributeName="x1"
               values="-400;0"
               dur="4s"
               repeatCount="indefinite"/>

      <animate attributeName="x2"
               values="0;400"
               dur="4s"
               repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect x="5" y="5"
        width="790" height="90"
        rx="14"
        fill="#161b22"
        stroke="#30363d"
        stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="65"
        text-anchor="middle"
        fill="url(#rainbow)"
        font-size="42"
        font-weight="bold"
        font-family="Arial, sans-serif">
    Virtual-Desktop
  </text>

</svg>
